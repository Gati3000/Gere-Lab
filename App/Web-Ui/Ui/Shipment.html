<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gere Lab - Shipment</title>
<link rel="stylesheet" href="Themes.css">
<!-- @page size is filled by JS so the paper always matches the chosen label size -->
<style id="pageStyle"></style>
<style>
.ship { flex:1; min-height:0; display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:18px; padding:18px 22px; }
.ship .window { min-height:0; }
[hidden] { display:none !important; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sizebar { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; }
.sizebar label { display:flex; flex-direction:column; gap:4px; color:var(--muted); font-size:.85rem; }
.sizebar input[type=number] { width:90px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font:inherit; }
.fields.one { grid-template-columns:1fr; margin-top:10px; }
.fields.one label, .row2 label { min-width:0; }
.fields.one input, .row2 input, .sizebar select { width:100%; min-width:0; }
.sizebar label.check { flex-direction:row; align-items:center; color:var(--text); padding-bottom:8px; }
.fields textarea { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font:inherit; resize:vertical; min-height:56px; }
.stage { flex:1; overflow:auto; padding:18px; display:flex; align-items:flex-start; justify-content:center; background:var(--panel2); }
.hint { color:var(--muted); font-size:.85rem; }

/* The label is always black on white, independent of the UI theme.
   Everything inside is sized in mm/em, so screen preview and print are the same element. */
#label { background:#fff; color:#000; width:var(--w); height:var(--h); font-size:var(--fs); line-height:1.25;
  padding:.8em; box-sizing:border-box; overflow:hidden; display:flex; flex-direction:column; gap:.55em;
  font-family:Arial, Helvetica, sans-serif; box-shadow:0 0 0 1px rgba(0,0,0,.25), var(--shadow); zoom:var(--zoom,1); flex:none; }
#label.frame { box-shadow:none; outline:.25mm solid #000; outline-offset:-.25mm; }
#label * { color:#000; }
.lb-head { display:flex; justify-content:space-between; align-items:flex-start; gap:.6em; border-bottom:.2em solid #000; padding-bottom:.4em; }
.lb-carrier { font-size:1.9em; font-weight:800; letter-spacing:.03em; line-height:1; }
.lb-meta { text-align:right; font-weight:700; font-size:1.05em; white-space:pre-line; }
.lb-from { font-size:.8em; border-bottom:.08em dashed #000; padding-bottom:.45em; }
.lb-tag { font-size:.75em; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.lb-to { flex:1; min-height:0; }
.lb-to .lb-name { font-size:1.6em; font-weight:800; line-height:1.1; margin-top:.15em; overflow-wrap:anywhere; }
.lb-to .lb-line { font-size:1.25em; font-weight:600; margin-top:.1em; overflow-wrap:anywhere; }
.lb-to .lb-city { font-size:1.45em; font-weight:800; margin-top:.2em; }
.lb-foot { border-top:.2em solid #000; padding-top:.4em; display:flex; justify-content:space-between; gap:.6em; align-items:flex-end; }
.lb-part { font-size:.95em; font-weight:600; overflow-wrap:anywhere; }
.lb-track { font-family:"Courier New", monospace; font-size:1.15em; font-weight:700; letter-spacing:.06em; white-space:nowrap; }
.lb-cod { border:.2em solid #000; padding:.1em .45em; font-weight:800; font-size:1.1em; white-space:nowrap; }
.lb-empty { display:none; }

@media (max-width:900px) { .ship { grid-template-columns:1fr; } .ship .window { min-height:360px; } }

@media print {
  html, body, .ship, .ship .window, .ship .content, .stage {
    display:block !important; height:auto !important; min-height:0 !important; overflow:visible !important;
    padding:0 !important; margin:0 !important; border:0 !important; border-radius:0 !important;
    box-shadow:none !important; background:#fff !important;
  }
  .topbar, .ship .editor, .ship .preview > h2 { display:none !important; }
  #label { zoom:1 !important; box-shadow:none !important; break-inside:avoid; page-break-after:avoid; }
  #label.frame { outline:.25mm solid #000; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Gere Lab</div>
  <div class="tools">
    <div class="row">
      <button class="btn" id="themeBtn" type="button"></button>
      <select id="langSel" aria-label="Language">
        <option value="pl">Polski</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <a class="btn" href="Home.html" data-i18n="home"></a>
    </div>
    <div class="row">
      <a class="btn" href="Settings.html" data-i18n="settings"></a>
    </div>
  </div>
</header>

<main class="ship">
  <section class="window editor">
    <h2 class="head">
      <span data-i18n="labelEdit"></span>
      <span class="headtools"><button class="btn" id="resetBtn" type="button" data-i18n="reset"></button><button class="btn primary" id="printBtn" type="button" data-i18n="print"></button></span>
    </h2>
    <div class="content">
      <div class="block">
        <h3 data-i18n="labelSize"></h3>
        <div class="sizebar">
          <label><span data-i18n="labelSize"></span>
            <select id="size">
              <option value="100x150">100 × 150 mm</option>
              <option value="100x100">100 × 100 mm</option>
              <option value="105x148">A6 (105 × 148 mm)</option>
              <option value="148x210">A5 (148 × 210 mm)</option>
              <option value="210x297">A4 (210 × 297 mm)</option>
              <option value="custom" data-i18n="sizeCustom"></option>
            </select>
          </label>
          <label id="wBox" hidden><span data-i18n="widthMm"></span><input id="w" type="number" min="30" max="400" step="1"></label>
          <label id="hBox" hidden><span data-i18n="heightMm"></span><input id="h" type="number" min="30" max="600" step="1"></label>
          <label class="check"><input id="frame" type="checkbox"><span data-i18n="frame"></span></label>
        </div>
        <p class="hint" style="margin-top:8px" data-i18n="printHint"></p>
      </div>

      <div class="block">
        <h3 data-i18n="recipientTitle"></h3>
        <div class="fields one">
          <label><span data-i18n="name"></span><input data-f="toName" type="text" autocomplete="off"></label>
          <label><span data-i18n="street"></span><input data-f="toStreet" type="text" autocomplete="off"></label>
          <div class="row2">
            <label><span data-i18n="postal"></span><input data-f="toPostal" type="text" autocomplete="off"></label>
            <label><span data-i18n="city"></span><input data-f="toCity" type="text" autocomplete="off"></label>
          </div>
          <div class="row2">
            <label><span data-i18n="country"></span><input data-f="toCountry" type="text" autocomplete="off"></label>
            <label><span data-i18n="phone"></span><input data-f="toPhone" type="text" autocomplete="off"></label>
          </div>
        </div>
      </div>

      <div class="block">
        <h3 data-i18n="parcelTitle"></h3>
        <div class="fields one">
          <div class="row2">
            <label><span data-i18n="carrier"></span><input data-f="carrier" type="text" autocomplete="off"></label>
            <label><span data-i18n="tracking"></span><input data-f="tracking" type="text" autocomplete="off"></label>
          </div>
          <div class="row2">
            <label><span data-i18n="weight"></span><input data-f="weight" type="text" inputmode="decimal" autocomplete="off"></label>
            <label><span data-i18n="packages"></span><input data-f="packages" type="text" inputmode="numeric" autocomplete="off"></label>
          </div>
          <label><span data-i18n="part"></span><input data-f="part" type="text" autocomplete="off"></label>
          <label><span data-i18n="cod"></span><input data-f="cod" type="text" autocomplete="off" placeholder="0.00 EUR"></label>
        </div>
      </div>

      <div class="block">
        <h3 data-i18n="senderTitle"></h3>
        <div class="fields one">
          <label><span data-i18n="name"></span><input data-f="fromName" type="text" autocomplete="off"></label>
          <label><span data-i18n="street"></span><input data-f="fromStreet" type="text" autocomplete="off"></label>
          <div class="row2">
            <label><span data-i18n="postal"></span><input data-f="fromPostal" type="text" autocomplete="off"></label>
            <label><span data-i18n="city"></span><input data-f="fromCity" type="text" autocomplete="off"></label>
          </div>
          <label><span data-i18n="phone"></span><input data-f="fromPhone" type="text" autocomplete="off"></label>
        </div>
      </div>
    </div>
  </section>

  <section class="window preview">
    <h2 data-i18n="labelPreview"></h2>
    <div class="content stage" id="stage">
      <div id="label">
        <div class="lb-head">
          <div class="lb-carrier" id="oCarrier"></div>
          <div class="lb-meta" id="oMeta"></div>
        </div>
        <div class="lb-from" id="oFromBox">
          <div class="lb-tag" data-i18n="labelFrom"></div>
          <div id="oFrom"></div>
        </div>
        <div class="lb-to">
          <div class="lb-tag" data-i18n="labelTo"></div>
          <div class="lb-name" id="oName"></div>
          <div class="lb-line" id="oStreet"></div>
          <div class="lb-city" id="oCity"></div>
          <div class="lb-line" id="oCountry"></div>
          <div class="lb-line" id="oPhone"></div>
        </div>
        <div class="lb-foot">
          <div>
            <div class="lb-part" id="oPart"></div>
            <div class="lb-track" id="oTrack"></div>
          </div>
          <div class="lb-cod" id="oCod"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="../Bin/Common.js"></script>
<script>
const DEFAULTS = {
  size:"100x150", w:100, h:150, frame:false,
  toName:"Jan Przykładowy", toStreet:"Calle Ejemplo 12, Nave 3", toPostal:"28001", toCity:"Madrid", toCountry:"ES", toPhone:"+34600000000",
  carrier:"MRW", tracking:"", weight:"5.0", packages:"1", part:"Alternator (Passat B6)", cod:"",
  fromName:"", fromStreet:"", fromPostal:"", fromCity:"", fromPhone:""
};
const KEY = "shipmentLabel";
let S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}

const $ = id => document.getElementById(id);
const inputs = [...document.querySelectorAll("[data-f]")];
const label = $("label");

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function setText(id, text) { $(id).textContent = text; }
function join(a, b, sep) { return [a, b].map(x => String(x || "").trim()).filter(Boolean).join(sep); }
function mm(v, d) { const n = parseFloat(v); return isFinite(n) ? Math.min(Math.max(n, 30), 600) : d; }

function sizeMm() {
  if (S.size === "custom") return [mm(S.w, 100), mm(S.h, 150)];
  const [w, h] = S.size.split("x").map(Number);
  return [w, h];
}

function render() {
  const [w, h] = sizeMm();
  const fs = (3.6 * Math.min(w / 100, h / 150)).toFixed(3) + "mm";
  label.style.setProperty("--w", w + "mm");
  label.style.setProperty("--h", h + "mm");
  label.style.setProperty("--fs", fs);
  label.classList.toggle("frame", !!S.frame);
  $("pageStyle").textContent = "@page { size: " + w + "mm " + h + "mm; margin: 0; }";

  setText("oCarrier", S.carrier);
  const pk = String(S.packages || "").trim(), wt = String(S.weight || "").trim();
  setText("oMeta", [pk ? pk + (/^\d+$/.test(pk) ? " pcs" : "") : "", wt ? wt + " kg" : ""].filter(Boolean).join("\n"));
  const from = [S.fromName, S.fromStreet, join(S.fromPostal, S.fromCity, " "), S.fromPhone].map(x => String(x || "").trim()).filter(Boolean).join(", ");
  setText("oFrom", from);
  $("oFromBox").classList.toggle("lb-empty", !from);
  setText("oName", S.toName);
  setText("oStreet", S.toStreet);
  setText("oCity", join(S.toPostal, S.toCity, " "));
  setText("oCountry", S.toCountry);
  setText("oPhone", S.toPhone ? "☎ " + S.toPhone : "");
  setText("oPart", S.part);
  setText("oTrack", S.tracking);
  const cod = String(S.cod || "").trim();
  setText("oCod", cod ? "COD " + cod : "");
  $("oCod").classList.toggle("lb-empty", !cod);
  fit();
}

function fit() {
  const [w] = sizeMm(), px = w * 96 / 25.4, avail = $("stage").clientWidth - 36;
  label.style.setProperty("--zoom", avail > 0 && px > avail ? (avail / px).toFixed(3) : "1");
}

function syncSizeUi() {
  $("size").value = S.size;
  const custom = S.size === "custom";
  $("wBox").hidden = $("hBox").hidden = !custom;
  $("w").value = S.w; $("h").value = S.h;
  $("frame").checked = !!S.frame;
}

inputs.forEach(i => { i.value = S[i.dataset.f] ?? ""; i.oninput = () => { S[i.dataset.f] = i.value; save(); render(); }; });
$("size").onchange = () => { S.size = $("size").value; if (S.size !== "custom") { const [w, h] = S.size.split("x").map(Number); S.w = w; S.h = h; } save(); syncSizeUi(); render(); };
$("w").oninput = () => { S.w = $("w").value; save(); render(); };
$("h").oninput = () => { S.h = $("h").value; save(); render(); };
$("frame").onchange = () => { S.frame = $("frame").checked; save(); render(); };
$("resetBtn").onclick = () => { S = Object.assign({}, DEFAULTS); save(); inputs.forEach(i => i.value = S[i.dataset.f] ?? ""); syncSizeUi(); render(); };
$("printBtn").onclick = () => { render(); window.print(); };
window.addEventListener("resize", fit);
window.addEventListener("beforeprint", render);
document.addEventListener("uichange", fit);

syncSizeUi();
render();
Common.init();
</script>
</body>
</html>
