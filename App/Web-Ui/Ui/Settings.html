<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gere Lab - Settings</title>
<link rel="stylesheet" href="Themes.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="Home.html">Gere Lab</a>
  <div class="tools">
    <div class="row">
      <a class="btn" href="Home.html" data-i18n="back"></a>
    </div>
  </div>
</header>
<main class="page">
  <section class="window">
    <h2 class="head">
      <span data-i18n="settingsTitle"></span>
      <span class="headtools"><span class="note" id="saveNote"></span><button class="btn primary" id="saveBtn" type="button" data-i18n="save"></button></span>
    </h2>
    <div class="content">
      <h3 class="sectiontitle" data-i18n="waTitle"></h3>
      <div class="block">
        <div class="blockhead">
          <h3 data-i18n="waCloud"></h3>
          <label class="check"><input data-k="cloud_api.enabled" type="checkbox"><span data-i18n="waUse"></span></label>
        </div>
        <p data-i18n="waCloudHint"></p>
        <div class="fields">
        <label><span data-i18n="waPhoneId"></span><input data-k="cloud_api.phone_number_id" type="text" autocomplete="off"></label>
        <label><span data-i18n="waVerifyToken"></span><input data-k="cloud_api.verify_token" type="password" autocomplete="off"></label>
        <label><span data-i18n="waAppSecret"></span><input data-k="cloud_api.app_secret" type="password" autocomplete="off"></label>
        <label><span data-i18n="waAccessToken"></span><input data-k="cloud_api.access_token" type="password" autocomplete="off"></label>
        <label><span data-i18n="waHost"></span><input data-k="cloud_api.host" type="text" autocomplete="off" placeholder="0.0.0.0"></label>
        <label><span data-i18n="waPort"></span><input data-k="cloud_api.port" type="text" autocomplete="off" placeholder="8081"></label>
        <label><span data-i18n="waPath"></span><input data-k="cloud_api.path" type="text" autocomplete="off" placeholder="/webhook"></label>
        </div>
        <div class="testrow"><button class="btn" type="button" data-test="cloud_api" data-i18n="waTest"></button><span class="note" data-result="cloud_api"></span></div>
      </div>
      <div class="block">
        <div class="blockhead">
          <h3 data-i18n="waBridge"></h3>
          <label class="check"><input data-k="bridge.enabled" type="checkbox"><span data-i18n="waUse"></span></label>
        </div>
        <p data-i18n="waBridgeHint"></p>
        <div class="fields">
        <label><span data-i18n="waUrl"></span><input data-k="bridge.url" type="text" autocomplete="off" placeholder="http://localhost:3000"></label>
        <label><span data-i18n="waApiKey"></span><input data-k="bridge.api_key" type="password" autocomplete="off"></label>
        <label><span data-i18n="waSession"></span><input data-k="bridge.session" type="text" autocomplete="off" placeholder="default"></label>
        </div>
        <div class="testrow"><button class="btn" type="button" data-test="bridge" data-i18n="waTest"></button><span class="note" data-result="bridge"></span></div>
      </div>
      <div class="block">
        <div class="blockhead">
          <h3 data-i18n="waProvider"></h3>
          <label class="check"><input data-k="provider.enabled" type="checkbox"><span data-i18n="waUse"></span></label>
        </div>
        <p data-i18n="waProviderHint"></p>
        <div class="fields">
        <label><span data-i18n="waAccountId"></span><input data-k="provider.account_id" type="text" autocomplete="off"></label>
        <label><span data-i18n="waAuthToken"></span><input data-k="provider.auth_token" type="password" autocomplete="off"></label>
        <label><span data-i18n="waSender"></span><input data-k="provider.sender_number" type="text" autocomplete="off" placeholder="+34"></label>
        </div>
        <div class="testrow"><button class="btn" type="button" data-test="provider" data-i18n="waTest"></button><span class="note" data-result="provider"></span></div>
      </div>
      <h3 class="sectiontitle">Wiadomości</h3>
      <div class="block">
        <div class="blockhead"><h3>Messeges retention</h3></div>
        <p>Ile dni wiadomości mają być wyświetlane i przechowywane. 0 = zawsze, nic nie jest usuwane. Wartość większa niż 0 trwale kasuje starsze pliki z Gere-Drive/Messeges.</p>
        <div class="fields">
        <label><span>Retention (dni)</span><input id="retentionDays" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></label>
        </div>
      </div>
      <h3 class="sectiontitle" data-i18n="invTitle"></h3>
      <div class="block">
        <div class="blockhead"><h3 data-i18n="invDelayTitle"></h3></div>
        <p data-i18n="invDelayHint"></p>
        <div class="fields">
        <label><span data-i18n="invDelayLabel"></span><input id="delayMinutes" type="text" inputmode="numeric" autocomplete="off" placeholder="5"></label>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal-bg" id="restartModal">
  <div class="modal">
    <h3 data-i18n="restartTitle"></h3>
    <p data-i18n="restartHint"></p>
    <div class="actions">
      <button class="btn ghost" id="restartLater" type="button" data-i18n="restartLater"></button>
      <button class="btn primary" id="restartNow" type="button" data-i18n="restartNow"></button>
    </div>
  </div>
</div>
<script src="../Bin/Common.js"></script>
<script>
Common.init();
const fields = [...document.querySelectorAll("[data-k]")];
const note = document.getElementById("saveNote");
const split = el => el.dataset.k.split(".");
const retentionBox = document.getElementById("retentionDays");
const delayBox = document.getElementById("delayMinutes");
const restartModal = document.getElementById("restartModal");
let savedDays = 0;
function fill(data) {
  const wa = (data && data.whatsapp) || {};
  const days = ((data && data.messages) || {}).retention_days;
  retentionBox.value = days ?? 0;
  savedDays = Number(days) || 0;
  delayBox.value = ((data && data.invoices) || {}).delay_minutes ?? 5;
  fields.forEach(el => {
    const [s, k] = split(el), v = (wa[s] || {})[k];
    if (el.type === "checkbox") el.checked = v === true;
    else el.value = v ?? "";
  });
}
function collect() {
  const out = {};
  fields.forEach(el => {
    const [s, k] = split(el);
    (out[s] = out[s] || {})[k] = el.type === "checkbox" ? el.checked : el.value.trim();
  });
  return { whatsapp: out, messages: { retention_days: retentionBox.value.trim() }, invoices: { delay_minutes: delayBox.value.trim() } };
}
async function load() {
  try {
    const r = await fetch("/api/config", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    fill(await r.json());
  } catch (e) { note.textContent = Common.t("loadFailed"); console.error("config load failed:", e); }
}
document.getElementById("saveBtn").onclick = async () => {
  const raw = retentionBox.value.trim();
  if (!/^\d+$/.test(raw)) { note.textContent = "Retention: podaj liczbę dni (0 = bez usuwania)"; return; }
  if (!/^\d+$/.test(delayBox.value.trim()) || Number(delayBox.value) > 1440) { note.textContent = Common.t("invDelayBad"); return; }
  const days = parseInt(raw, 10);
  if (days > 0 && days !== savedDays && !confirm("UWAGA: pliki wiadomości starsze niż " + days + " dni zostaną TRWALE usunięte z dysku (Gere-Drive/Messeges). Tego nie da się cofnąć. Kontynuować?")) return;
  try {
    const r = await fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(collect()) });
    if (!r.ok) throw new Error(r.status);
    const saved = await r.json();
    fill(saved);
    note.textContent = Common.t("saved");
    if (saved.restart) restartModal.classList.add("open");
  } catch (e) { note.textContent = Common.t("saveFailed"); console.error("config save failed:", e); }
};
document.getElementById("restartLater").onclick = () => restartModal.classList.remove("open");
document.getElementById("restartNow").onclick = async () => {
  try {
    const r = await fetch("/api/restart", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    if (!r.ok) throw new Error(r.status);
    note.textContent = Common.t("restartDone");
  } catch (e) { note.textContent = Common.t("restartFailed"); console.error("restart failed:", e); }
  restartModal.classList.remove("open");
};
document.querySelectorAll("[data-test]").forEach(btn => btn.onclick = async () => {
  const out = document.querySelector('[data-result="' + btn.dataset.test + '"]');
  out.textContent = Common.t("waTesting");
  try {
    const r = await fetch("/api/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ section: btn.dataset.test }) });
    if (!r.ok) throw new Error(r.status);
    out.textContent = Common.t((await r.json()).code);
  } catch (e) { out.textContent = Common.t("waTestFail"); console.error("test failed:", e); }
});
load();
</script>
</body>
</html>
