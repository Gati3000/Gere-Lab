<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gere Lab - Links</title>
<link rel="stylesheet" href="Themes.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="Home.html">Gere Lab</a>
  <div class="tools">
    <div class="row">
      <button class="btn" id="themeBtn" type="button"></button>
      <select id="langSel" aria-label="Language">
        <option value="pl">Polski</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <a class="btn" href="Home.html" data-i18n="home"></a>
    </div>
    <div class="row">
      <a class="btn" href="Settings.html" data-i18n="settings"></a>
      <a class="btn" href="Instruction.html" data-i18n="instruction"></a>
    </div>
  </div>
</header>
<main class="page">
  <section class="window">
    <h2 class="head">
      <span data-i18n="linksTitle"></span>
      <button class="btn primary" id="addBtn" type="button">+</button>
    </h2>
    <div class="content" id="links"></div>
  </section>
</main>
<div class="modal-bg" id="linkModal">
  <div class="modal">
    <h3 data-i18n="addLink"></h3>
    <div class="fields">
      <label><span data-i18n="linkName"></span><input id="linkName" type="text" autocomplete="off"></label>
      <label><span data-i18n="linkUrl"></span><input id="linkUrl" type="text" autocomplete="off" placeholder="https://"></label>
      <label><span data-i18n="linkDesc"></span><input id="linkDesc" type="text" autocomplete="off"></label>
    </div>
    <p id="linkNote"></p>
    <div class="actions">
      <button class="btn ghost" id="linkCancel" type="button" data-i18n="cancel"></button>
      <button class="btn primary" id="linkSave" type="button" data-i18n="save"></button>
    </div>
  </div>
</div>
<script src="../Bin/Common.js"></script>
<script>
let LINKS = [];
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function renderLinks() {
  const box = document.getElementById("links"); box.replaceChildren();
  if (!LINKS.length) { box.append(el("div", "empty", Common.t("noLinks"))); return; }
  LINKS.forEach(l => {
    const row = el("div", "block linkrow"), left = el("div");
    left.append(el("div", "name", l.name), el("div", "desc", l.desc));
    const a = el("a", "btn primary", Common.t("open")); a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    row.append(left, a); box.append(row);
  });
}
async function loadLinks() {
  try {
    const r = await fetch("/api/links", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    LINKS = (await r.json()).links || [];
  } catch (e) { console.error("links load failed:", e); }
  renderLinks();
}
const modal = document.getElementById("linkModal"), linkNote = document.getElementById("linkNote");
const linkInputs = ["linkName", "linkUrl", "linkDesc"].map(id => document.getElementById(id));
document.getElementById("addBtn").onclick = () => { linkInputs.forEach(i => i.value = ""); linkNote.textContent = ""; modal.classList.add("open"); };
document.getElementById("linkCancel").onclick = () => modal.classList.remove("open");
document.getElementById("linkSave").onclick = async () => {
  const [name, url, desc] = linkInputs.map(i => i.value.trim());
  if (!name || !url) { linkNote.textContent = Common.t("linkMissing"); return; }
  try {
    const r = await fetch("/api/links", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, url, desc }) });
    if (!r.ok) throw new Error(r.status);
    LINKS = (await r.json()).links || [];
    modal.classList.remove("open");
    renderLinks();
  } catch (e) { linkNote.textContent = Common.t("linkFailed"); console.error("link save failed:", e); }
};
document.addEventListener("uichange", renderLinks);
Common.init();
loadLinks();
</script>
</body>
</html>
