<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gere Lab</title>
<link rel="stylesheet" href="Themes.css">
<style>
[hidden] { display:none !important; }
.card .items { white-space:pre-line; }
.card .note { color:var(--muted); font-size:.85rem; margin-top:8px; }
.card .ref { color:var(--muted); font-size:.85rem; margin-bottom:6px; display:flex; justify-content:space-between; gap:10px; }
.card .actions button:disabled { opacity:.5; cursor:default; }
#invError { margin-bottom:10px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="Home.html">Gere Lab</a>
  <div class="tools">
    <div class="row">
      <button class="btn" id="themeBtn" type="button"></button>
      <select id="langSel" aria-label="Language">
        <option value="pl">Polski</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <a class="btn" href="Settings.html" data-i18n="settings"></a>
    </div>
    <div class="row">
      <a class="btn" href="Index.html" data-i18n="links"></a>
      <a class="btn" href="Shipment.html" data-i18n="shipment"></a>
      <a class="btn" href="Instruction.html" data-i18n="instruction"></a>
    </div>
  </div>
</header>

<main class="layout">
  <section class="window">
    <h2 data-i18n="messages"></h2>
    <div class="content" id="messages"></div>
  </section>
  <section class="window">
    <h2><span data-i18n="invoices"></span><span id="invCount"></span></h2>
    <div class="content" id="invoices">
      <div class="empty" id="invError" hidden data-i18n="invoiceError"></div>
      <div id="invoiceList"></div>
    </div>
  </section>
</main>

<div class="modal-bg" id="rejectModal">
  <div class="modal">
    <h3 data-i18n="invRejectTitle"></h3>
    <p data-i18n="invRejectHint"></p>
    <textarea id="rejectReason" data-i18n-ph="reasonPh"></textarea>
    <div class="actions">
      <button class="btn ghost" id="rejectCancel" type="button" data-i18n="cancel"></button>
      <button class="btn primary" id="rejectSend" type="button" data-i18n="send"></button>
    </div>
  </div>
</div>

<script src="../Bin/Common.js"></script>
<script>
const MESSAGES = [];
let INVOICES = [];
let lastInvoices = "";
let rejectId = null;

const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function money(value, currency) { return value + " " + (currency || "EUR"); }

function renderMessages() {
  const box = $("messages"); box.replaceChildren();
  if (!MESSAGES.length) { box.append(el("div","empty",Common.t("noMessages"))); return; }
  MESSAGES.forEach(m => {
    const d = el("div","msg"), meta = el("div","meta");
    meta.append(el("span","",m.from), el("span","",m.time));
    d.append(meta, el("div","",m.text)); box.append(d);
  });
}

// Wszystkie teksty z faktur (nazwy klientów, części, uwagi) idą przez textContent, nigdy innerHTML.
function renderInvoices() {
  const box = $("invoiceList"); box.replaceChildren();
  $("invCount").textContent = INVOICES.length ? " (" + INVOICES.length + ")" : "";
  if (!INVOICES.length) { box.append(el("div","empty",Common.t("noInvoices"))); return; }
  INVOICES.forEach(inv => {
    const card = el("div","card"), dl = el("dl");
    const ref = el("div","ref");
    ref.append(el("span","",inv.id), el("span","",String(inv.created || "").slice(0, 16).replace("T", " ")));
    const lines = (inv.items || []).map(i => i.qty + " × " + i.name + " — " + money(i.price, inv.currency));
    [["invoiceClient", inv.client_name || inv.contact || "-"],
     ["invoiceItems", lines.join("\n")],
     ["invoiceTotal", money(inv.total, inv.currency)]].forEach(([k, v]) => {
      const dd = el("dd","",v);
      if (k === "invoiceItems") dd.className = "items";
      dl.append(el("dt","",Common.t(k)), dd);
    });
    card.append(ref, dl);
    if (inv.note) card.append(el("div","note",inv.note));
    const a = el("div","actions");
    const ok = el("button","btn primary",Common.t("accept")), no = el("button","btn",Common.t("reject"));
    ok.type = no.type = "button";
    ok.onclick = () => { ok.disabled = no.disabled = true; decide(inv.id, "approve", ""); };
    no.onclick = () => { rejectId = inv.id; $("rejectReason").value = ""; $("rejectModal").classList.add("open"); $("rejectReason").focus(); };
    a.append(ok, no); card.append(a);
    box.append(card);
  });
}

async function loadInvoices() {
  try {
    const r = await fetch("/api/invoices?status=pending", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const next = (await r.json()).invoices || [];
    $("invError").hidden = true;
    const sig = JSON.stringify(next);
    if (sig !== lastInvoices) { lastInvoices = sig; INVOICES = next; renderInvoices(); }
  } catch (e) { console.error("invoices load failed:", e); $("invError").hidden = false; }
}

// 409 = ta faktura została już rozstrzygnięta (np. w drugiej karcie), wystarczy odświeżyć listę.
async function decide(id, action, reason) {
  try {
    const r = await fetch("/api/invoices/" + encodeURIComponent(id) + "/" + action, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason: reason || "" })
    });
    if (!r.ok && r.status !== 409) throw new Error(r.status);
  } catch (e) { console.error("invoice decision failed:", e); $("invError").hidden = false; }
  lastInvoices = "";
  await loadInvoices();
}

function closeModal() { $("rejectModal").classList.remove("open"); rejectId = null; }
$("rejectCancel").onclick = closeModal;
$("rejectModal").onclick = e => { if (e.target.id === "rejectModal") closeModal(); };
$("rejectSend").onclick = () => {
  const id = rejectId, reason = $("rejectReason").value.trim();
  closeModal();
  if (id !== null) decide(id, "reject", reason);
};

document.addEventListener("uichange", () => { renderMessages(); renderInvoices(); });
async function loadMessages() {
  try {
    const r = await fetch("/api/messages", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    MESSAGES.length = 0;
    (data.messages || []).forEach(m => MESSAGES.push({
      from: m.from || "",
      time: String(m.time || "").slice(5, 16).replace("T", " "),
      text: m.text || ""
    }));
    renderMessages();
  } catch (e) { console.error("messages load failed:", e); }
}
Common.init();
loadMessages();
loadInvoices();
setInterval(loadMessages, 10000);
setInterval(loadInvoices, 10000);
</script>
</body>
</html>
